name: wheels

# Wheel builds need a full engine tree + OpenCV inside cibuildwheel containers.
# Tag pushes currently only ship source; publish wheels manually once the
# monorepo sdist / manylinux packaging is ready.
#
# Do NOT trigger on tags until cmake.source-dir + CRT + OpenMP are proven in CI.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels without uploading artifacts"
        type: boolean
        default: false

# Actions are pinned to commit SHAs (the tag in the comment); the job token
# can only read the repository.
permissions:
  contents: read

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Sparse OpenCV checkout
        # Required: without it the build plants stubs itself, but a missing
        # script is a broken checkout, not something to skip.
        shell: bash
        run: bash scripts/sparse-opencv.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.5

      # Run from the engine root so the parent tree exists for cmake.source-dir.
      # Skip win32 (OpenCV host build is amd64-focused) and musllinux for now.
      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-win32 *-musllinux_* pp*"
          # pytest 9 requires Python >= 3.10; 8.4.2 is the last release that
          # installs on every interpreter in CIBW_BUILD (cp39 included).
          CIBW_TEST_REQUIRES: "pytest==8.4.2 numpy"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          # macOS: Apple Clang has no OpenMP of its own. CMake reads neither
          # CPPFLAGS nor LDFLAGS when looking for it, so these used to leave
          # find_package(OpenMP) failing and the wheel silently serial;
          # OpenMP_ROOT is what FindOpenMP searches.
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: >-
            OpenMP_ROOT="$(brew --prefix libomp)"
          # Fail the macOS build rather than ship a serial wheel.
          CIBW_CONFIG_SETTINGS_MACOS: "cmake.define.SEMPER_REQUIRE_OPENMP=ON"
        run: python -m cibuildwheel bindings/python --output-dir wheelhouse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.dry_run }}
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
