name: ci

# Engine correctness lives here (sempermechanics/semper-dic-engine), not in the
# private Android app. App CI only builds/links the pinned submodule.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # Host suite — math + DICe + full-field contracts (system OpenCV)
  # ===================================================================
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache OpenCV packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-libopencv-dev-${{ runner.os }}-v1

      - name: Install OpenCV + ccache
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-cache" libopencv-dev ccache
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-host-tests-${{ github.sha }}
          restore-keys: ccache-host-tests-

      - name: Configure
        run: >
          cmake -S tests -B build/tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_REQUIRE_OPENCV=ON
          -DSEMPER_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/tests -j"$(nproc)"

      - name: Run dic_tests
        run: ./build/tests/dic_tests

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # ===================================================================
  # Determinism — the bit-exactness gate for the OpenCL work
  #
  # Builds identical source at two -march levels and byte-compares the
  # captured golden corpora. SSE2 gives 4 float lanes, x86-64-v3 gives
  # AVX2's 8 plus FMA; before the canonical-math work these produced
  # different results, which is why the golden tolerances had been
  # widened for "runner FP noise". They must now be identical byte for
  # byte, because the OpenCL kernels have to reproduce one defined
  # answer and cannot chase a target that moves with the host ISA.
  # ===================================================================
  determinism:
    name: Cross-ABI determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libopencv-dev

      - name: Build and capture at each -march level
        run: |
          set -euo pipefail
          for arch in x86-64 x86-64-v3; do
            cmake -S tests -B "build/$arch" \
              -DCMAKE_BUILD_TYPE=Release -DDIC_REQUIRE_OPENCV=ON \
              -DCMAKE_CXX_FLAGS="-march=$arch"
            cmake --build "build/$arch" -j"$(nproc)"
            SEMPER_GOLDEN_CAPTURE=1 SEMPER_GOLDEN_FILE="corpus_$arch.bin" \
              "./build/$arch/dic_tests" GoldenCorpus
          done

      - name: Compare captures byte for byte
        run: |
          set -euo pipefail
          status=0
          for v in bicubic keys6x6; do
            if cmp "corpus_x86-64.bin.$v" "corpus_x86-64-v3.bin.$v"; then
              echo "  $v: bit-identical across SSE2 / AVX2"
            else
              echo "::error::$v differs between -march=x86-64 and -march=x86-64-v3."
              echo "The canonical reduction order or FP flags have been broken."
              echo "See docs/DETERMINISM.md."
              status=1
            fi
          done
          exit $status

  # ===================================================================
  # Sanitizers — ASan+UBSan and TSan on every change
  # ===================================================================
  sanitizers:
    name: Sanitized (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: "address,undefined"
            id: asan-ubsan
          - sanitizer: "thread"
            id: tsan
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-san-${{ matrix.id }}-${{ github.sha }}
          restore-keys: ccache-san-${{ matrix.id }}-

      - name: Configure
        run: >
          cmake -S tests -B build/tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_SANITIZER=${{ matrix.sanitizer }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/tests -j"$(nproc)"

      - name: Run dic_tests
        run: ./build/tests/dic_tests

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # ===================================================================
  # C ABI smoke — vendored OpenCV, libsemper_c
  # ===================================================================
  c-sdk-smoke:
    name: C SDK smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sparse OpenCV checkout
        run: bash scripts/sparse-opencv.sh

      - name: Configure C SDK
        run: |
          cmake -S . -B build/sdk \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEMPER_BUILD_C_SDK=ON \
            -DSEMPER_BUILD_TESTS=OFF \
            -DSEMPER_ANDROID=OFF

      - name: Build semper_c + smoke + contract
        run: cmake --build build/sdk --target semper_c semper_c_smoke semper_c_contract -j"$(nproc)"

      - name: Run C smoke
        run: |
          SMOKE=$(find build/sdk -name semper_c_smoke -type f | head -n1)
          test -n "$SMOKE"
          # Shared lib lives next to the adapter build tree on Linux.
          export LD_LIBRARY_PATH="$(dirname "$SMOKE"):$(dirname "$SMOKE")/../adapters/c:${LD_LIBRARY_PATH:-}"
          # Also search common CMake output dirs.
          for d in build/sdk/adapters/c build/sdk/lib build/sdk/bin; do
            [ -d "$d" ] && export LD_LIBRARY_PATH="$(pwd)/$d:$LD_LIBRARY_PATH"
          done
          "$SMOKE"

      - name: Run C ABI contract
        run: |
          CONTRACT=$(find build/sdk -name semper_c_contract -type f | head -n1)
          test -n "$CONTRACT"
          export LD_LIBRARY_PATH="$(dirname "$CONTRACT"):$(dirname "$CONTRACT")/../adapters/c:${LD_LIBRARY_PATH:-}"
          for d in build/sdk/adapters/c build/sdk/lib build/sdk/bin; do
            [ -d "$d" ] && export LD_LIBRARY_PATH="$(pwd)/$d:$LD_LIBRARY_PATH"
          done
          "$CONTRACT"

      - name: Check exported ABI symbols against golden list
        run: |
          # VERSION/SOVERSION makes libsemper_c.so a symlink to
          # libsemper_c.so.$MAJOR; -type f would skip the link and fail
          # the test -n check with no nm output.
          LIB=$(find build/sdk -name 'libsemper_c.so' | head -n1)
          test -n "$LIB"
          echo "Inspecting $LIB"
          # The six documented entry points are the ONLY symbols that may be
          # exported (visibility is hidden + explicit SEMPER_C_API). An accidental
          # export, or a dropped annotation, changes this set and fails the diff.
          nm -D --defined-only "$LIB" | awk '$2=="T"{print $3}' \
            | grep '^semper_' | sort > /tmp/abi_symbols.actual
          echo "Exported semper_* symbols:"; cat /tmp/abi_symbols.actual
          if ! diff -u tests/c/abi_symbols.txt /tmp/abi_symbols.actual; then
            echo "::error::Exported C ABI symbol set drifted from tests/c/abi_symbols.txt"
            echo "If this change is intentional, update the golden list and bump the"
            echo "version per docs/CONTRACT.md §A.1."
            exit 1
          fi

  # ===================================================================
  # Coverage — report-only, no gate (SEMPER_COVERAGE). Surfaces which src/
  # files the host suite exercises so future boundary gaps are visible.
  # ===================================================================
  coverage:
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenCV + gcovr
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libopencv-dev gcovr

      - name: Configure (coverage)
        run: >
          cmake -S tests -B build/cov
          -DCMAKE_BUILD_TYPE=Debug
          -DSEMPER_COVERAGE=ON
          -DDIC_REQUIRE_OPENCV=ON

      - name: Build
        run: cmake --build build/cov -j"$(nproc)"

      - name: Run dic_tests
        run: ./build/cov/dic_tests

      - name: gcovr report (src/ only)
        run: |
          # Report-only: no --fail-under, no threshold. Text summary to the log,
          # machine-readable XML as an artifact.
          gcovr --root . build/cov --filter 'src/' --print-summary --xml-pretty -o coverage.xml
          echo "----- src/ line coverage -----"
          gcovr --root . build/cov --filter 'src/' --txt

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
