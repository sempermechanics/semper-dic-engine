name: ci

# Engine correctness lives here (sempermechanics/semper-dic-engine), not in the
# private Android app. App CI only builds/links the pinned submodule.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are pinned to commit SHAs (the tag in the comment); the job token
# can only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a pull request's run; a push to main never cancels
  # the run of the commit before it, whose failure would otherwise go unseen.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===================================================================
  # Host suite — math + DICe + full-field contracts (system OpenCV)
  # ===================================================================
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        # A new key each month, so the cached .debs follow the archive instead of
        # staying as first saved; restore-keys starts from last month's.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-host-tests-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-host-tests-${{ runner.os }}-

      - name: Install OpenCV + ccache
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh libopencv-dev ccache

      - name: Cache ccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-host-tests-${{ github.sha }}
          restore-keys: ccache-host-tests-

      - name: Configure
        # DIC_REQUIRE_JNI: the JniAdapter suite compiles the Android adapter
        # against the runner's NDK jni.h (ANDROID_NDK_LATEST_HOME); fail
        # rather than leave it out if the image ever stops shipping one.
        run: >
          cmake -S tests -B build/tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_REQUIRE_OPENCV=ON
          -DDIC_REQUIRE_JNI=ON
          -DSEMPER_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/tests -j"$(nproc)"

      - name: Run dic_tests
        run: ctest --test-dir build/tests --output-on-failure

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # ===================================================================
  # Serial build — the pipeline without OpenMP (DIC_OPENMP=OFF), as on a
  # toolchain that has none (MSVC, Apple Clang without libomp). The same
  # suite must pass, and the build must stay warning-free.
  # ===================================================================
  serial-build:
    name: Host tests (no OpenMP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-serial-build-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-serial-build-${{ runner.os }}-

      - name: Install OpenCV + ccache
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh libopencv-dev ccache

      - name: Cache ccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-serial-${{ github.sha }}
          restore-keys: ccache-serial-

      - name: Configure
        run: >
          cmake -S tests -B build/tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_REQUIRE_OPENCV=ON
          -DDIC_REQUIRE_JNI=ON
          -DDIC_OPENMP=OFF
          -DSEMPER_WERROR=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/tests -j"$(nproc)"

      - name: Check OpenMP is really off
        # No compile line may carry -fopenmp, and dic_tests must not call
        # into an OpenMP runtime (GOMP_* for libgomp, __kmpc_* for libomp).
        # Symbols, not ldd: the system OpenCV may pull a runtime in itself.
        # Fails closed: a missing compile database or a failing nm is an error,
        # not a pass (`if grep` alone took either for "no match").
        run: |
          test -s build/tests/compile_commands.json || {
            echo "::error::no compile_commands.json to check"; exit 1; }
          if grep -q -- '-fopenmp' build/tests/compile_commands.json; then
            echo "::error::a compile command uses -fopenmp"; exit 1
          fi
          undef=$(nm -D --undefined-only build/tests/dic_tests)
          test -n "$undef"
          if grep -E ' (GOMP_|omp_|__kmpc_)' <<<"$undef"; then
            echo "::error::dic_tests calls into an OpenMP runtime"; exit 1
          fi
          echo "no -fopenmp, no OpenMP runtime calls"

      - name: Run dic_tests
        run: ctest --test-dir build/tests --output-on-failure

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # ===================================================================
  # Sanitizers — ASan+UBSan and TSan on every change, each split over two
  # runners: shard 1 runs SHARD_1, shard 2 everything else, so every test
  # runs exactly once (a renamed test lands in shard 2). SHARD_1 is the
  # three longest incremental tests, about half the suite under either
  # sanitizer (ASan 293 s of 576 s, TSan 279 s of 534 s on fbfaae3).
  # ===================================================================
  sanitizers:
    name: Sanitized (${{ matrix.id }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        id: [asan-ubsan, tsan]
        shard: [1, 2]
        include:
          - id: asan-ubsan
            sanitizer: "address,undefined"
            cmake_extra: ""
            omp_tool: ""
            packages: "ccache libopencv-dev"
          - id: tsan
            sanitizer: "thread"
            cmake_extra: "-DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18"
            omp_tool: "/usr/lib/llvm-18/lib/libarcher.so"
            packages: "ccache libopencv-dev clang-18 libomp-18-dev libclang-rt-18-dev"
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      SHARD_1: "Incremental.EarlyUpdate_WhenReportedPointsDrop:Incremental.Rotation90_200Frames_TracksTheTurningRoi:Incremental.LongHorizon_160Frames"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-san-${{ matrix.id }}-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-san-${{ matrix.id }}-${{ runner.os }}-

      - name: Install toolchain
        # libopencv-dev is required or _SEMPER_OPENCV_READY stays false and the
        # whole full-field pipeline is silently excluded from the build — the
        # sanitizers would then only ever see the math suite. The JNI adapter
        # (JniAdapter suite) needs no package: the runner image's NDK supplies
        # jni.h, and DIC_REQUIRE_JNI fails configure if it is missing.
        # clang/libomp/compiler-rt are required for the TSan job only (ASan
        # builds with GCC): GCC's libgomp carries no ThreadSanitizer
        # instrumentation, so it reports hundreds of false races on reused
        # OpenMP stack frames. LLVM's libomp plus the Archer OMPT tool gives
        # TSan the fork/join edges and reports none.
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh ${{ matrix.packages }}

      - name: Cache ccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-san-${{ matrix.id }}-${{ github.sha }}
          restore-keys: ccache-san-${{ matrix.id }}-

      - name: Configure
        run: >
          cmake -S tests -B build/tests
          -DCMAKE_BUILD_TYPE=Release
          -DDIC_REQUIRE_OPENCV=ON
          -DDIC_REQUIRE_JNI=ON
          -DDIC_SANITIZER=${{ matrix.sanitizer }}
          ${{ matrix.cmake_extra }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/tests -j"$(nproc)"

      - name: Run dic_tests
        env:
          OMP_TOOL_LIBRARIES: ${{ matrix.omp_tool }}
          # libomp's own lazy lock-pool init races with itself, entirely inside
          # the uninstrumented runtime with no engine frames on either stack.
          TSAN_OPTIONS: ignore_noninstrumented_modules=1
          # The build already aborts on the first report
          # (-fno-sanitize-recover); this adds the stack to the log.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [ "${{ matrix.shard }}" = 1 ]; then F="$SHARD_1"; else F="-$SHARD_1"; fi
          ./build/tests/dic_tests "$F"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # ===================================================================
  # The shipped configuration — vendored OpenCV 4.14, as the C SDK, the
  # wheels and the Android library link it. The host jobs above build against
  # the runner's system OpenCV (headers of the vendored core for the SIMD
  # intrinsics, libraries of another version); this one runs the whole host
  # suite against the OpenCV that ships, plus the C ABI smoke and contract
  # binaries, the exported-symbol check and the C++ example.
  # ===================================================================
  c-sdk-smoke:
    name: Vendored OpenCV (C SDK, host tests, examples)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Most of this job is compiling the vendored OpenCV (280-360 s cold).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Sparse OpenCV checkout
        run: bash scripts/sparse-opencv.sh

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-ccache-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-ccache-${{ runner.os }}-

      - name: Install ccache
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh ccache

      - name: Cache ccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-c-sdk-${{ github.sha }}
          restore-keys: ccache-c-sdk-

      - name: Configure
        run: |
          cmake -S . -B build/sdk \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEMPER_BUILD_C_SDK=ON \
            -DSEMPER_BUILD_TESTS=ON \
            -DSEMPER_BUILD_EXAMPLES=ON \
            -DSEMPER_ANDROID=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: >
          cmake --build build/sdk -j"$(nproc)"
          --target semper_c semper_c_smoke semper_c_contract dic_tests run_translation

      - name: Run dic_tests, C smoke and C ABI contract
        run: ctest --test-dir build/sdk --output-on-failure

      - name: Check exported ABI symbols against golden list
        run: |
          # VERSION/SOVERSION makes libsemper_c.so a symlink to
          # libsemper_c.so.$MAJOR; -type f would skip the link.
          LIB=$(find build/sdk -name 'libsemper_c.so' | head -n1)
          test -n "$LIB"
          echo "Inspecting $LIB"
          # Every defined dynamic symbol, of any type -- not only text symbols
          # named semper_*: a leaked C++ or OpenCV symbol, data or weak, fails
          # here too. The documented entry points are the ONLY exports
          # (adapters/c/semper_c.map, -fvisibility=hidden, SEMPER_C_API).
          nm -D --defined-only "$LIB" > /tmp/abi_nm
          test -s /tmp/abi_nm
          awk '{print $NF}' /tmp/abi_nm | sort > /tmp/abi_symbols.actual
          echo "Exported symbols:"; cat /tmp/abi_symbols.actual
          if ! diff -u tests/c/abi_symbols.txt /tmp/abi_symbols.actual; then
            echo "::error::Exported C ABI symbol set drifted from tests/c/abi_symbols.txt"
            echo "If this change is intentional, update the golden list and bump the"
            echo "version per docs/CONTRACT.md §A.1."
            exit 1
          fi

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # ===================================================================
  # The C ABI and the Python module under ASan+UBSan: the two adapters that
  # take raw pointers, capacities and arrays from their callers. dic_tests
  # does not link either, so the sanitizer jobs above never saw them.
  # ===================================================================
  adapters-sanitized:
    name: C ABI + Python (ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Sparse OpenCV checkout
        run: bash scripts/sparse-opencv.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-ccache-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-ccache-${{ runner.os }}-

      - name: Install ccache
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh ccache

      - name: Install pybind11, numpy, pytest
        run: python -m pip install -r bindings/python/requirements-ci.txt

      - name: Cache ccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-adapters-san-${{ github.sha }}
          restore-keys: ccache-adapters-san-

      - name: Configure
        run: |
          cmake -S . -B build/san \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEMPER_SANITIZER=address,undefined \
            -DSEMPER_BUILD_C_SDK=ON \
            -DSEMPER_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE="$(command -v python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/san -j"$(nproc)" --target semper_c semper_c_smoke semper_c_contract _semper

      - name: C smoke and C ABI contract
        run: ctest --test-dir build/san --output-on-failure -R '^semper_c_'

      - name: Python binding tests
        # The interpreter is not instrumented, so the runtime is preloaded;
        # CPython's own allocations are not leaks the engine made.
        run: |
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG/semper"
          cp bindings/python/semper/*.py "$PKG/semper/"
          cp "$(find build/san -name '_semper*.so' | head -n1)" "$PKG/semper/"
          cd "$RUNNER_TEMP"
          LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)" \
          ASAN_OPTIONS=detect_leaks=0 PYTHONPATH="$PKG" \
            python -m pytest -v "$GITHUB_WORKSPACE/bindings/python/tests"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  # ===================================================================
  # Python bindings — pip-build the package from the tree (scikit-build-core,
  # vendored OpenCV) and run its tests against what was installed
  # ===================================================================
  python-bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      # CMake (>= 3.17) reads these from the environment, so they reach the
      # configure that pip runs through scikit-build-core.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Sparse OpenCV checkout
        run: bash scripts/sparse-opencv.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-ccache-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-ccache-${{ runner.os }}-

      - name: Install ccache
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh ccache

      - name: Cache ccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-python-${{ github.sha }}
          restore-keys: ccache-python-

      - name: Build and install semper-dic
        # A fixed build dir: pip's default is a fresh temporary directory per
        # build, and objects that include OpenCV's generated headers from it
        # would never hit the cache.
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"
          python -m pip install -r bindings/python/requirements-ci.txt
          python -m pip install -v -C build-dir="$GITHUB_WORKSPACE/build/py" ./bindings/python

      - name: Run binding tests
        # Outside the checkout, so `import semper` can only resolve to the
        # installed package, never bindings/python/semper (no extension there).
        working-directory: ${{ runner.temp }}
        run: python -m pytest -v "$GITHUB_WORKSPACE/bindings/python/tests"

  # ===================================================================
  # Android — compile the JNI adapter (libsemper_core.so) with the NDK.
  # Build only: nothing here runs on a device.
  # ===================================================================
  android-ndk:
    name: Android NDK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # A runner image with a newer NDK changes the compiler: content, not
      # mtime, decides whether old objects still apply.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Sparse OpenCV checkout
        run: bash scripts/sparse-opencv.sh

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-ccache-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-ccache-${{ runner.os }}-

      - name: Install ccache
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh ccache

      - name: Cache ccache objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: Configure
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cmake -S . -B build/android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEMPER_ANDROID=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build semper_android
        run: cmake --build build/android --target semper_android -j"$(nproc)"

      - name: Check the JNI entry points are exported
        run: |
          LIB=$(find build/android -name libsemper_core.so -type f | head -n1)
          test -n "$LIB"
          NM="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "$LIB" > /tmp/jni_nm
          test -s /tmp/jni_nm
          # Every JNI entry point, both packages, against the golden list: a
          # dropped export (or an unexpected new one) fails here, not with an
          # UnsatisfiedLinkError in the app.
          awk '{print $NF}' /tmp/jni_nm | grep -E '^(Java_|JNI_)' | sort > /tmp/jni_symbols
          cat /tmp/jni_symbols
          diff -u tests/jni/jni_symbols.txt /tmp/jni_symbols

  # ===================================================================
  # Coverage — report-only, no gate (SEMPER_COVERAGE). Surfaces which src/
  # files the host suite exercises so future boundary gaps are visible.
  # Split over two runners like the sanitizers (Debug + gcov ran the suite
  # in 935 s on fbfaae3, 373 s of it one test); each exports gcovr JSON and
  # coverage-report merges them.
  # ===================================================================
  coverage:
    name: Coverage (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Debug + gcov runs the incremental and DICe suites several times slower
    # than Release; 30 min cut the run off mid-suite.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # 466 s of the 935 s on fbfaae3; shard 2 runs the rest.
      SHARD_1: "Incremental.EarlyUpdate_WhenReportedPointsDrop:Incremental.LongHorizon_160Frames:DiceIncremental.OhtCfrp_LadderTotalsAgreeWithDice"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-coverage-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-coverage-${{ runner.os }}-

      - name: Install OpenCV + gcovr
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh libopencv-dev gcovr

      - name: Configure (coverage)
        run: >
          cmake -S tests -B build/cov
          -DCMAKE_BUILD_TYPE=Debug
          -DSEMPER_COVERAGE=ON
          -DDIC_REQUIRE_OPENCV=ON

      - name: Build
        run: cmake --build build/cov -j"$(nproc)"

      - name: Run dic_tests
        run: |
          if [ "${{ matrix.shard }}" = 1 ]; then F="$SHARD_1"; else F="-$SHARD_1"; fi
          ./build/cov/dic_tests "$F"

      - name: gcovr JSON (src/ only)
        run: gcovr --root . build/cov --filter 'src/' --json -o coverage-${{ matrix.shard }}.json

      - name: Upload coverage JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-json-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.json

  coverage-report:
    name: Coverage (report-only)
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The tracefiles name sources relative to the repo root.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-coverage-report-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: apt-coverage-report-${{ runner.os }}-

      - name: Install gcovr
        timeout-minutes: 15
        # The same gcovr as the shards (same runner image), so it reads
        # their JSON.
        run: bash scripts/ci-apt-install.sh gcovr

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-json-*
          merge-multiple: true
          path: cov

      - name: gcovr report (src/ only)
        run: |
          # Report-only: no --fail-under, no threshold. Text summary to the log,
          # machine-readable XML as an artifact.
          gcovr --root . --add-tracefile 'cov/coverage-*.json' --print-summary --xml-pretty -o coverage.xml
          echo "----- src/ line coverage -----"
          gcovr --root . --add-tracefile 'cov/coverage-*.json' --txt

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
